name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify there are no third-party dependencies
        shell: bash
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(Object.assign({}, p.dependencies, p.devDependencies));
            if (deps.length) { console.error('Unexpected dependencies:', deps); process.exit(1); }
          "
      # Tests run on the built-in node:test runner; lint uses Node built-ins.
      - name: Test
        run: node scripts/test.js
      - name: Lint
        run: node scripts/lint.js
      # The rfc packages install their published asn1.js runtime dependency.
      - name: Test rfc/2560 and rfc/5280
        run: |
          npm run test-2560
          npm run test-5280
